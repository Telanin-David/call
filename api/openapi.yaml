openapi: "3.1.0"
info:
  title: Dialer API
  version: "0.1.0"
  description: |
    Single API contract for the Dialer sales dialer.
    All routes require a session cookie except /auth/signup, /auth/signin, /auth/confirm/email,
    /auth/forgot and /auth/reset. Writes must be sent as application/json.
    Money is always an integer in micro-dollars (1 USD = 1,000,000).
servers:
  - url: http://localhost:8080
    description: Local dev
  - url: https://api.dialer.app
    description: Production

tags:
  - name: auth
    description: Sign up, confirm, sign in, sign out, reset password
  - name: me
    description: Profile, settings, today's limits
  - name: plans
    description: Compare, upgrade, move to Free
  - name: wallet
    description: Balance, activity, statement, top-ups
  - name: numbers
    description: Search, rent, cancel, set default
  - name: lists
    description: Lead lists
  - name: leads
    description: Leads within a list
  - name: imports
    description: CSV upload, column matching, check, add
  - name: scripts
    description: Rep scripts
  - name: calls
    description: Call lifecycle
  - name: dialer
    description: Auto-dial engine
  - name: followups
    description: Follow-up tasks
  - name: history
    description: Call log
  - name: recordings
    description: Call recordings (Pro)
  - name: kyc
    description: ID and face check
  - name: pairing
    description: Phone–laptop pairing via QR code
  - name: admin
    description: Admin console endpoints
  - name: webhooks
    description: Inbound webhooks from providers

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string

  /auth/signup:
    post:
      tags: [auth]
      summary: Create an account and sign in
      description: |
        Sends a confirmation link by email and a 6-digit code by SMS, and sets
        the session cookie. The account can be used once both are confirmed.
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/confirm/email:
    post:
      tags: [auth]
      summary: Confirm the email with the token from the emailed link
      description: Needs no session; the link may be opened on another device. Opening it twice is fine.
      operationId: authConfirmEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Email confirmed
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/confirm/phone:
    post:
      tags: [auth]
      summary: Confirm the phone with the 6-digit code
      description: Five wrong tries end the code; ask for a new one with /auth/resend.
      operationId: authConfirmPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "307142"
      responses:
        "200":
          description: Phone confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/resend:
    post:
      tags: [auth]
      summary: Send a new email link or phone code
      description: At most one a minute and five an hour. A new code replaces the old one.
      operationId: authResend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [email, sms, whatsapp]
      responses:
        "204":
          description: Sent (or nothing to send because it is already confirmed)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/signin:
    post:
      tags: [auth]
      summary: Sign in with email or phone and password
      operationId: authSignin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          description: Signed in; session cookie set. If `confirmed` is false, show the confirm screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/signout:
    post:
      tags: [auth]
      summary: Sign out; clears session cookie
      operationId: authSignout
      responses:
        "204":
          description: Signed out

  /auth/forgot:
    post:
      tags: [auth]
      summary: Send a password reset code to the account's phone
      description: Answers 204 whether or not the account exists.
      operationId: authForgot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login:
                  type: string
                  description: Email or phone number
      responses:
        "204":
          description: Code sent if the account exists
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset:
    post:
      tags: [auth]
      summary: Set a new password using the reset code
      description: Signs the account out on every device.
      operationId: authReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, code, password]
              properties:
                login:
                  type: string
                  description: Email or phone number
                code:
                  type: string
                password:
                  type: string
                  minLength: 10
      responses:
        "204":
          description: Password updated
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      tags: [me]
      summary: Get own profile and today's limits
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/settings:
    patch:
      tags: [me]
      summary: Update settings (timezone, country, etc.)
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /plans:
    get:
      tags: [plans]
      summary: Free, Starter and Pro with their prices
      description: Signed-in reps also get intro_eligible (the intro price is for a first paid plan only).
      operationId: listPlans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                  intro_eligible:
                    type: boolean

  /subscription:
    get:
      tags: [plans]
      summary: The rep's plan, next renewal and any booked change
      operationId: getSubscription
      responses:
        "200":
          description: OK. Only `plan` is set on Free.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [plans]
      summary: Change plan
      description: |
        Moving up starts now and is paid from the balance today: the first
        month from Free, or the difference for the rest of the month between
        paid plans. Moving down (including to Free) is booked for the next
        renewal; the rep keeps what they paid for until then. Choosing the
        current plan cancels a booked move.
      operationId: changeSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeRequest"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanQuote"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /subscription/quote:
    post:
      tags: [plans]
      summary: What a change of plan would cost, without making it
      operationId: quoteSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanQuote"

  /wallet:
    get:
      tags: [wallet]
      summary: Balance, money held for calls, this month's spending, and the first page of activity
      operationId: getWallet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallet/activity:
    get:
      tags: [wallet]
      summary: More activity, newest first (holds are not listed)
      operationId: getWalletActivity
      parameters:
        - name: cursor
          in: query
          description: next_cursor from the previous page
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerEntry"
                  next_cursor:
                    type: string
                    description: Empty when there are no more entries

  /wallet/statement:
    get:
      tags: [wallet]
      summary: One month's statement as CSV, in the rep's time zone, with exact amounts
      operationId: getWalletStatement
      parameters:
        - name: month
          in: query
          description: YYYY-MM; defaults to the current month
          schema:
            type: string
            example: "2026-10"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /wallet/topups:
    post:
      tags: [wallet]
      summary: Start a card top-up
      description: |
        Opens a checkout with Paystack (cards from Nigeria, Ghana, Kenya) or
        Stripe (everyone else); the server picks by the rep's country. Nothing
        reaches the balance until the provider's signed webhook confirms the
        payment. Needs confirmed email and phone.
      operationId: startTopup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
      responses:
        "201":
          description: Send the rep to payment_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /wallet/topups/{reference}:
    get:
      tags: [wallet]
      summary: Where a top-up is, for the page the rep returns to
      operationId: getTopup
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                  status:
                    type: string
                    enum: [pending, succeeded, failed]
                  amount_microdollars:
                    type: integer
                    format: int64
                  created_at:
                    type: string
                    format: date-time
        "404":
          description: Not this rep's top-up

  /numbers:
    get:
      tags: [numbers]
      summary: The rep's rented numbers, the default first
      operationId: listMyNumbers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [numbers, monthly_total_microdollars, monthly_price_microdollars, max_numbers]
                properties:
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/RentedNumber"
                  monthly_total_microdollars:
                    type: integer
                    format: int64
                    description: What next month's renewals cost (cancelled numbers left out)
                  monthly_price_microdollars:
                    type: integer
                    format: int64
                  max_numbers:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [numbers]
      summary: Rent a number and pay its first month from the balance
      operationId: rentNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, country]
              properties:
                number:
                  type: string
                  description: E.164, from /numbers/available
                city:
                  type: string
                  description: The city shown with it in the search, kept for display
                country:
                  type: string
                  enum: [US, CA]
      responses:
        "201":
          description: Rented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentedNumber"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: The phone provider can't be reached or isn't set up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /numbers/available:
    get:
      tags: [numbers]
      summary: Local numbers for rent in an area code
      operationId: searchNumbers
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
            enum: [US, CA]
        - name: area_code
          in: query
          required: true
          schema:
            type: string
            pattern: "^[2-9][0-9]{2}$"
      responses:
        "200":
          description: Available numbers
          content:
            application/json:
              schema:
                type: object
                required: [numbers, monthly_price_microdollars]
                properties:
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailableNumber"
                  monthly_price_microdollars:
                    type: integer
                    format: int64
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: The phone provider can't be reached or isn't set up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /numbers/{numberId}:
    delete:
      tags: [numbers]
      summary: Cancel a number; the rep keeps it until the month paid for ends
      operationId: cancelNumber
      parameters:
        - name: numberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled; cancel_on is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentedNumber"
        "404":
          description: Not one of the rep's numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /numbers/{numberId}/keep:
    post:
      tags: [numbers]
      summary: Undo a cancel before the number is released
      operationId: keepNumber
      parameters:
        - name: numberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentedNumber"
        "404":
          description: Not one of the rep's numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /numbers/{numberId}/default:
    put:
      tags: [numbers]
      summary: Make this the default outbound number
      operationId: setDefaultNumber
      parameters:
        - name: numberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Default set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentedNumber"
        "404":
          description: Not one of the rep's numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /lists:
    get:
      tags: [lists]
      summary: The rep's lead lists with progress, newest first
      operationId: listLeadLists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lists]
                properties:
                  lists:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /lists/{listId}:
    delete:
      tags: [lists]
      summary: Delete a list, its leads and their follow-ups (calls stay in history; refused during a call to one of its leads)
      operationId: deleteLeadList
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: No such list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          $ref: "#/components/responses/Conflict"

  /imports/check:
    post:
      tags: [imports]
      summary: Read a CSV and say what uploading it would add and leave out
      description: |
        Without a mapping, the server suggests one from the column names.
        A mapping that can't be used yet (no phone column) comes back as
        `problem`, with the columns, so the rep can fix it. Nothing is saved.
      operationId: checkImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: What the upload would do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCheck"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: File over 2 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          $ref: "#/components/responses/ValidationError"

  /imports:
    post:
      tags: [imports]
      summary: Upload a CSV as a new list
      description: |
        Everything is checked again on the server. US and Canada numbers go
        into the named list; numbers elsewhere go into a second list named
        "<name> · outside US and Canada".
      operationId: createImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImportRequest"
                - type: object
                  required: [mapping, name]
      responses:
        "201":
          description: The lists created
          content:
            application/json:
              schema:
                type: object
                required: [lists]
                properties:
                  lists:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: File over 2 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          $ref: "#/components/responses/ValidationError"

  /scripts:
    get:
      tags: [scripts]
      summary: The rep's scripts, most recently changed first
      operationId: listScripts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [scripts, fields, on_screen_free_until]
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Script"
                  fields:
                    type: array
                    description: The fill-in words a script can use, like {first_name}
                    items:
                      type: string
                  on_screen_free_until:
                    type: string
                    format: date
                    nullable: true
                    description: On Free, the day the script stops showing on the call screen (2 months after sign-up). Null on Starter and Pro.
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [scripts]
      summary: Save a new script
      operationId: createScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /scripts/{scriptId}:
    parameters:
      - name: scriptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [scripts]
      summary: Replace a script's name and parts, and which lists use it
      operationId: updateScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "404":
          description: No such script, or one of the lists doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [scripts]
      summary: Delete a script; lists that used it are left without one
      operationId: deleteScript
      responses:
        "204":
          description: Deleted
        "404":
          description: No such script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /calls:
    post:
      tags: [calls]
      summary: Check every calling rule, hold the first minute and start a call
      description: |
        The server checks, in this order: do-not-call, premium-rate, 3 tries
        per number, calling hours (8 am–9 pm the lead's time), the daily dial
        limit, a rate for the country, the daily cap abroad before the ID
        check, a number to call from, and money for the first minute. A "no"
        comes back as a Blocked body (board 34). Nothing is charged until the
        lead answers; the browser then dials with `token`, attaching
        `client_state` so the provider's events find this call.
      operationId: startCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_id]
              properties:
                via:
                  type: string
                  enum: [laptop, phone]
                  description: phone sends the call through the rep's linked phone (Starter and Pro); it must be online
                lead_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedCall"
        "402":
          description: Not enough money for the first minute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"
        "403":
          description: A calling rule says no
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"
        "404":
          description: Not one of the rep's leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"
        "409":
          description: Already on a call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"
        "503":
          description: Calling isn't set up or the provider can't be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"

  /calls/{callId}:
    get:
      tags: [calls]
      summary: A call's state, cost so far and outcome
      operationId: getCall
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not one of the rep's calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"

  /calls/{callId}/hangup:
    post:
      tags: [calls]
      summary: End a call
      operationId: hangupCall
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ended and billed to the second, with the final time and cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /calls/{callId}/outcome:
    post:
      tags: [calls]
      summary: Save how an ended call went; saving again replaces it (Undo)
      operationId: saveOutcome
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutcomeRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "409":
          description: The call hasn't ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"
        "422":
          description: Unknown outcome, a bad follow-up time or a long note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"

  /dialer/start:
    post:
      tags: [dialer]
      summary: Start auto-dial session (Starter/Pro)
      operationId: startDialer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_id]
              properties:
                list_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Session started

  /dialer/pause:
    post:
      tags: [dialer]
      summary: Pause auto-dial
      operationId: pauseDialer
      responses:
        "204":
          description: Paused

  /dialer/skip:
    post:
      tags: [dialer]
      summary: Skip current lead
      operationId: skipDialer
      responses:
        "204":
          description: Skipped

  /dialer/stop:
    post:
      tags: [dialer]
      summary: Stop auto-dial session
      operationId: stopDialer
      responses:
        "204":
          description: Stopped

  /today:
    get:
      tags: [calls]
      summary: The rep's day at a glance (the Today screen)
      operationId: getToday
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [dials_today, dial_limit, today, yesterday, followups_due, due, ready_list]
                properties:
                  dials_today:
                    type: integer
                  dial_limit:
                    type: integer
                    nullable: true
                    description: Null on Pro (no limit)
                  today:
                    $ref: "#/components/schemas/CallTotals"
                  yesterday:
                    $ref: "#/components/schemas/CallTotals"
                  followups_due:
                    type: integer
                    description: Open follow-ups due by the end of the rep's day, overdue included
                  due:
                    type: array
                    description: The first 5 of them
                    items:
                      $ref: "#/components/schemas/Followup"
                  ready_list:
                    type: object
                    nullable: true
                    description: The list to call next (last called with leads left, else the newest)
                    required: [id, name, left, script_name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      left:
                        type: integer
                      script_name:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /followups:
    get:
      tags: [followups]
      summary: Open follow-ups in one tab, with counts for every tab
      operationId: listFollowups
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [today, tomorrow, week, later]
            default: today
          description: today includes anything overdue; week is the rest of the next 7 days
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [counts, followups]
                properties:
                  counts:
                    type: object
                    required: [today, tomorrow, week, later]
                    properties:
                      today:
                        type: integer
                      tomorrow:
                        type: integer
                      week:
                        type: integer
                      later:
                        type: integer
                  followups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Followup"

  /followups/{followupId}/done:
    post:
      tags: [followups]
      summary: Tick off a follow-up without calling
      operationId: finishFollowup
      parameters:
        - name: followupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Done
        "404":
          description: Not one of the rep's follow-ups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"

  /history:
    get:
      tags: [history]
      summary: Ended calls, newest first, 50 a page
      operationId: listHistory
      parameters:
        - name: outcome
          in: query
          schema:
            type: string
            enum: [interested, callback, not_interested, no_answer, wrong_number, do_not_call]
        - name: q
          in: query
          description: Part of a name, company or number
          schema:
            type: string
        - name: cursor
          in: query
          description: next_cursor from the previous page
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"

  /queue:
    get:
      tags: [calls]
      summary: The leads the call screen works through, with their scripts and the rep's limits
      description: |
        One of list, followups or lead; with none, the list Today offers.
        Leaves out leads that can't be called (3 tries, do-not-call, done);
        every rule is checked again on each dial.
      operationId: getQueue
      parameters:
        - name: list
          in: query
          schema:
            type: string
            format: uuid
        - name: followups
          in: query
          description: "1: the leads with a follow-up due today, in due order"
          schema:
            type: string
            enum: ["1"]
        - name: lead
          in: query
          description: Just this lead
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "404":
          description: No such list or lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocked"

  /recordings/{callId}:
    get:
      tags: [recordings]
      summary: Get recording metadata (Pro)
      operationId: getRecording
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"

  /verification:
    get:
      tags: [kyc]
      summary: The rep's latest ID check
      operationId: getVerification
      responses:
        "200":
          description: OK (status none when there has been no check)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
    post:
      tags: [kyc]
      summary: Send a photo of an ID and a selfie for the ID check
      description: |
        Images are JPEG or PNG, base64 or data URLs, up to 3 MB each (face
        frames 1 MB, at most 8). They go straight to the provider and are not
        stored. One check at a time, 3 a day; an approved check lifts the
        new-account limits.
      operationId: startVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationRequest"
      responses:
        "202":
          description: Sent; the result comes later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Too big
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: The ID check is unavailable

  /pairing:
    get:
      tags: [pairing]
      summary: The rep's link between laptop and phone; both poll it
      description: |
        `?as=phone` is the phone checking in (about every second). A phone not
        seen for 6 seconds shows as lost; a call on it is ended after 15.
        Only the phone gets the live call's client_state.
      operationId: getPairing
      parameters:
        - name: as
          in: query
          schema:
            type: string
            enum: [laptop, phone]
      responses:
        "200":
          description: OK (status none when nothing is linked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
    post:
      tags: [pairing]
      summary: Make a 6-digit code to link a phone (laptop side; Starter and Pro)
      description: Replaces any open link. The code works once, for 10 minutes, for this account only; 5 wrong codes end it.
      operationId: createPairing
      responses:
        "201":
          description: Code made (only in this reply)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [pairing]
      summary: Unlink the phone (either side); a call going through it ends
      operationId: endPairing
      responses:
        "204":
          description: Unlinked

  /pairing/join:
    post:
      tags: [pairing]
      summary: Link this phone with the code from the laptop
      operationId: joinPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                phone_name:
                  type: string
                  maxLength: 60
      responses:
        "200":
          description: Linked; token signs the phone's browser phone in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        "404":
          description: Wrong, old or another account's code

  /pairing/mute:
    post:
      tags: [pairing]
      summary: Mute or unmute the linked phone from the laptop
      operationId: mutePairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted:
                  type: boolean
      responses:
        "204":
          description: Done

  /webhooks/telnyx:
    post:
      tags: [webhooks]
      summary: Telnyx call events (call.initiated, call.answered, call.hangup)
      description: |
        The ed25519 signature (telnyx-signature-ed25519 over
        "telnyx-timestamp|body", within 5 minutes) is checked before anything
        else. Calls the server didn't start, or dialled to another number,
        are hung up at once.
      operationId: telnyxWebhook
      responses:
        "200":
          description: Acknowledged
        "401":
          description: Bad or old signature

  /webhooks/paystack:
    post:
      tags: [webhooks]
      summary: Paystack payment webhook
      description: Checked with x-paystack-signature (HMAC-SHA512 of the body) before anything is read. A repeated webhook never credits twice.
      operationId: paystackWebhook
      responses:
        "200":
          description: Acknowledged
        "401":
          description: Signature missing or wrong

  /webhooks/stripe:
    post:
      tags: [webhooks]
      summary: Stripe payment webhook
      description: Checked with Stripe-Signature (HMAC-SHA256, 5-minute window) before anything is read. A repeated webhook never credits twice.
      operationId: stripeWebhook
      responses:
        "200":
          description: Acknowledged
        "401":
          description: Signature missing or wrong

  /webhooks/smileid:
    post:
      tags: [webhooks]
      summary: Smile ID says an ID check has a result
      description: |
        The signature (HMAC-SHA256 of timestamp + partner id + "sid_request")
        is checked first. Smile ID signs only the timestamp, so the body is
        never trusted: the result is read back from Smile ID's job_status.
      operationId: smileidWebhook
      responses:
        "200":
          description: Acknowledged

  /admin/users:
    get:
      tags: [admin]
      summary: List users
      operationId: adminListUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: OK

  /admin/kyc:
    get:
      tags: [admin]
      summary: List pending KYC checks
      operationId: adminListKyc
      responses:
        "200":
          description: OK

components:
  schemas:
    ErrorBody:
      type: object
      required: [error, code]
      description: Every error has this shape. `error` is shown to the rep as is.
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable reason, e.g. "code_wrong"
        fields:
          type: object
          additionalProperties:
            type: string

    SignupRequest:
      type: object
      required: [name, email, phone, password, country, accept_rules]
      properties:
        name:
          type: string
          description: Full name as on the rep's ID; the card name must match it
        email:
          type: string
          format: email
        phone:
          type: string
          description: With country code, e.g. "+234 803 123 4567"; stored as E.164
        password:
          type: string
          minLength: 10
        country:
          type: string
          description: ISO 3166-1 alpha-2
        timezone:
          type: string
          description: IANA zone, e.g. "Africa/Lagos". Defaults to UTC.
        accept_rules:
          type: boolean
          description: Must be true

    SigninRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Email or phone number
        password:
          type: string

    User:
      type: object
      required: [user_id, name, email, phone, country, timezone, email_confirmed, phone_confirmed, confirmed, rules_accepted_at, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        country:
          type: string
        timezone:
          type: string
        email_confirmed:
          type: boolean
        phone_confirmed:
          type: boolean
        confirmed:
          type: boolean
          description: Both email and phone confirmed
        rules_accepted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    MeResponse:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [plan, balance_microdollars, held_microdollars]
          properties:
            plan:
              type: string
              enum: [free, starter, pro]
            balance_microdollars:
              type: integer
              format: int64
              description: What the rep can spend now. 1 USD = 1,000,000.
            held_microdollars:
              type: integer
              format: int64
              description: Set aside for calls in progress; already taken off the balance

    SettingsRequest:
      type: object
      properties:
        timezone:
          type: string
        country:
          type: string

    Plan:
      type: object
      required: [id, monthly_fee_microdollars, intro_fee_microdollars, intro_months, rate_multiplier_pct, us_price_per_minute_microdollars, dials_per_day, features]
      properties:
        id:
          type: string
          enum: [free, starter, pro]
        monthly_fee_microdollars:
          type: integer
          format: int64
        intro_fee_microdollars:
          type: integer
          format: int64
        intro_months:
          type: integer
        rate_multiplier_pct:
          type: integer
          description: Call price = provider cost × this ÷ 100
        us_price_per_minute_microdollars:
          type: integer
          format: int64
        dials_per_day:
          type: integer
          nullable: true
        features:
          type: array
          items:
            type: string

    Subscription:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, starter, pro]
        started_at:
          type: string
          format: date-time
        intro_ends_on:
          type: string
          format: date
          nullable: true
        next_renewal:
          type: string
          format: date
        pending_change:
          type: string
          nullable: true
          description: Plan the rep moves to at next_renewal
        next_charge_microdollars:
          type: integer
          format: int64
        renewal_failed_at:
          type: string
          format: date-time
          nullable: true
        grace_ends_at:
          type: string
          format: date-time
          nullable: true
          description: Top up before this or move to Free

    PlanChangeRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id:
          type: string
          enum: [free, starter, pro]

    PlanQuote:
      type: object
      required: [from, to, kind, due_today_microdollars, intro_price, starts_on, next_renewal, next_charge_microdollars, balance_microdollars, balance_after_microdollars]
      properties:
        from:
          type: string
        to:
          type: string
        kind:
          type: string
          enum: [upgrade, downgrade, stay]
        due_today_microdollars:
          type: integer
          format: int64
        intro_price:
          type: boolean
        starts_on:
          type: string
          format: date
        next_renewal:
          type: string
          format: date
          nullable: true
        next_charge_microdollars:
          type: integer
          format: int64
        balance_microdollars:
          type: integer
          format: int64
        balance_after_microdollars:
          type: integer
          format: int64

    WalletResponse:
      type: object
      required: [balance_microdollars, held_microdollars, spent_this_month, activity, next_cursor, min_topup_microdollars, max_topup_microdollars, topup_provider]
      properties:
        balance_microdollars:
          type: integer
          format: int64
          description: What the rep can spend now. 1 USD = 1,000,000.
        held_microdollars:
          type: integer
          format: int64
        spent_this_month:
          type: object
          required: [calls, plan, numbers, total]
          properties:
            calls:
              type: integer
              format: int64
            plan:
              type: integer
              format: int64
            numbers:
              type: integer
              format: int64
            total:
              type: integer
              format: int64
        activity:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        next_cursor:
          type: string
        min_topup_microdollars:
          type: integer
          format: int64
        max_topup_microdollars:
          type: integer
          format: int64
        topup_provider:
          type: string
          enum: [paystack, stripe]

    LedgerEntry:
      type: object
      required: [id, type, amount_microdollars, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [topup, call, number, plan, refund]
        amount_microdollars:
          type: integer
          format: int64
          description: Positive in, negative out
        description:
          type: string
        created_at:
          type: string
          format: date-time

    TopupRequest:
      type: object
      required: [amount_microdollars]
      properties:
        amount_microdollars:
          type: integer
          format: int64
          minimum: 5000000
          maximum: 500000000
          description: Whole cents ($5 to $500)

    TopupResponse:
      type: object
      required: [reference, payment_url, provider, amount_microdollars]
      properties:
        reference:
          type: string
        payment_url:
          type: string
        provider:
          type: string
          enum: [paystack, stripe]
        amount_microdollars:
          type: integer
          format: int64

    AvailableNumber:
      type: object
      required: [number, city]
      properties:
        number:
          type: string
          description: E.164
        city:
          type: string
          description: Its area, like "New York, NY"; empty when unknown

    RentedNumber:
      type: object
      required: [id, number, city, country, is_default, monthly_price_microdollars, renews_on, cancel_on, renewal_failed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        city:
          type: string
        country:
          type: string
          enum: [US, CA]
        is_default:
          type: boolean
        monthly_price_microdollars:
          type: integer
          format: int64
        renews_on:
          type: string
          format: date
        cancel_on:
          type: string
          format: date
          nullable: true
          description: Set when cancelled; the number is released on this day
        renewal_failed_at:
          type: string
          format: date-time
          nullable: true
          description: The renewal couldn't be paid; released 3 days later unless the rep adds money
        created_at:
          type: string
          format: date-time

    LeadList:
      type: object
      required: [id, name, region, status, lead_count, called_count, followup_count, script, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
          enum: [us_ca, abroad]
        status:
          type: string
          enum: [new, active, done, abroad]
        lead_count:
          type: integer
        called_count:
          type: integer
          description: Leads called at least once
        followup_count:
          type: integer
          description: Follow-ups not done yet
        script:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        created_at:
          type: string
          format: date-time

    LeadField:
      type: string
      description: What a CSV column is saved as. full_name is split into first and last name.
      enum: [first_name, last_name, full_name, company, phone, email, city, notes, skip]

    ImportRequest:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          description: The file's text, up to 2 MB and 5,000 rows
        mapping:
          type: array
          description: One field per column, in column order
          items:
            $ref: "#/components/schemas/LeadField"
        name:
          type: string
          maxLength: 80

    ImportCheck:
      type: object
      required: [columns, rows, ready, abroad, left_out, left_out_rows, problem]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [header, sample, field]
            properties:
              header:
                type: string
              sample:
                type: string
                description: The first value in the column
              field:
                $ref: "#/components/schemas/LeadField"
        rows:
          type: integer
          description: Lead rows in the file (blank lines don't count)
        ready:
          type: integer
          description: US and Canada leads that would go into the list
        abroad:
          type: integer
          description: Leads that would go into the separate list
        left_out:
          type: object
          description: Rows not added to the list, by reason
          required: [invalid, premium, duplicate, dnc, listed, abroad]
          properties:
            invalid:
              type: integer
            premium:
              type: integer
            duplicate:
              type: integer
            dnc:
              type: integer
            listed:
              type: integer
            abroad:
              type: integer
        left_out_rows:
          type: array
          description: The first 200 rows not added
          items:
            $ref: "#/components/schemas/LeftOutRow"
        problem:
          type: object
          nullable: true
          description: Why the mapping can't be used yet; counts are zero until it's fixed
          required: [code, error]
          properties:
            code:
              type: string
            error:
              type: string

    LeftOutRow:
      type: object
      required: [row, name, phone, reason, same_as_row, list_name]
      properties:
        row:
          type: integer
          description: Line in the file; the header is line 1
        name:
          type: string
        phone:
          type: string
          description: As written in the file
        reason:
          type: string
          enum: [invalid, premium, duplicate, dnc, listed, abroad]
        same_as_row:
          type: integer
          nullable: true
          description: For a duplicate, the line it repeats
        list_name:
          type: string
          nullable: true
          description: For a number already listed, the list it's in

    ScriptPart:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 80
        body:
          type: string
          maxLength: 3000
          description: Text with fill-in words in curly brackets, like {first_name}

    Script:
      type: object
      required: [id, name, parts, lists, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parts:
          type: array
          items:
            $ref: "#/components/schemas/ScriptPart"
        lists:
          type: array
          description: Lead lists that use this script
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        updated_at:
          type: string
          format: date-time

    ScriptRequest:
      type: object
      required: [name, parts]
      properties:
        name:
          type: string
          maxLength: 80
        parts:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/ScriptPart"
        list_ids:
          type: array
          description: Exactly the lists that use the script after saving. Leave out to keep them as they are.
          items:
            type: string
            format: uuid

    Blocked:
      type: object
      description: Why a call can't start or an action failed, in the rep's words (board 34)
      required: [code, error, title, action]
      properties:
        code:
          type: string
          description: daily_limit, low_balance, three_tries, do_not_call, premium, calling_hours, no_rate, abroad_cap, no_number, on_a_call, suspended, lead_not_found, …
        title:
          type: string
        error:
          type: string
          description: The message under the title
        action:
          type: string
          enum: ["", top_up, skip, verify_id, upgrade, get_number]

    StartedCall:
      type: object
      required: [call_id, lead_id, lead_name, from, to, price_per_minute_microdollars, held_microdollars, token, client_state, her_time_zone, phone]
      properties:
        call_id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        lead_name:
          type: string
        from:
          type: string
          description: The rep's number the lead sees (closest to the lead, else the default)
        to:
          type: string
        price_per_minute_microdollars:
          type: integer
          format: int64
        held_microdollars:
          type: integer
          format: int64
        token:
          type: string
          description: Signs the browser phone in
        client_state:
          type: string
          description: Attach to the call; only this browser knows it
        her_time_zone:
          type: string
          description: IANA zone for "their time"; empty when unknown
        phone:
          type: string
          enum: [telnyx, fake, paired]
          description: Which browser phone dials; fake only in development, where /dev/calls plays the provider; paired means the linked phone dials

    Call:
      type: object
      required: [id, lead_id, from, to, status, price_per_minute_microdollars, started_at, answered_at, ended_at, seconds, cost_microdollars, low_balance, outcome, note]
      properties:
        id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
          nullable: true
        from:
          type: string
        to:
          type: string
        status:
          type: string
          enum: [dialing, ringing, answered, ended]
        price_per_minute_microdollars:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        seconds:
          type: integer
        cost_microdollars:
          type: integer
          format: int64
        low_balance:
          type: boolean
          description: The balance can't cover the next minute; the call ends in under 30 seconds
        outcome:
          type: string
          nullable: true
          enum: [interested, callback, not_interested, no_answer, wrong_number, do_not_call, null]
        note:
          type: string

    OutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [interested, callback, not_interested, no_answer, wrong_number, do_not_call]
          description: Keys 1 to 6 on the call screen, in this order
        note:
          type: string
          maxLength: 2000
        follow_up_at:
          type: string
          format: date-time
          nullable: true
          description: Books a follow-up (not with do_not_call or wrong_number); within a year

    LeadRef:
      type: object
      required: [id, name, company, phone, her_time_zone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        company:
          type: string
        phone:
          type: string
        her_time_zone:
          type: string
          description: IANA zone; empty when unknown

    CallTotals:
      type: object
      required: [calls, talk_seconds, spent_microdollars, interested]
      properties:
        calls:
          type: integer
        talk_seconds:
          type: integer
        spent_microdollars:
          type: integer
          format: int64
        interested:
          type: integer

    Followup:
      type: object
      required: [id, lead, due_at, reason, last_note, last_outcome]
      properties:
        id:
          type: string
          format: uuid
        lead:
          $ref: "#/components/schemas/LeadRef"
        due_at:
          type: string
          format: date-time
        reason:
          type: string
        last_note:
          type: string
        last_outcome:
          type: string
          nullable: true

    Queue:
      type: object
      required: [title, list_id, leads, scripts, script_free_until, dials_today, dial_limit, balance_microdollars, price_per_minute_microdollars, live_call_id]
      properties:
        title:
          type: string
          description: The list's name, or "Follow-ups due today"
        list_id:
          type: string
          format: uuid
          nullable: true
        leads:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/QueueLead"
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/QueueScript"
        script_free_until:
          type: string
          format: date
          nullable: true
          description: Free only; from this day the script is a Starter feature on the call screen
        dials_today:
          type: integer
        dial_limit:
          type: integer
          nullable: true
        balance_microdollars:
          type: integer
          format: int64
        price_per_minute_microdollars:
          type: integer
          format: int64
          description: The rep's price per minute to the US and Canada
        live_call_id:
          type: string
          format: uuid
          nullable: true
          description: A call still open from before, to end it

    QueueLead:
      type: object
      required: [id, name, first_name, company, city, email, phone, notes, her_time_zone, attempts, list_name, script_id, last_call]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        first_name:
          type: string
        company:
          type: string
        city:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        her_time_zone:
          type: string
        attempts:
          type: integer
        list_name:
          type: string
        script_id:
          type: string
          format: uuid
          nullable: true
        last_call:
          type: object
          nullable: true
          required: [at, outcome, note]
          properties:
            at:
              type: string
              format: date-time
            outcome:
              type: string
              nullable: true
            note:
              type: string

    QueueScript:
      type: object
      required: [id, name, parts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parts:
          type: array
          items:
            $ref: "#/components/schemas/ScriptPart"

    HistoryResponse:
      type: object
      required: [calls, next_cursor, week]
      properties:
        calls:
          type: array
          items:
            $ref: "#/components/schemas/CallRecord"
        next_cursor:
          type: string
          description: Empty on the last page
        week:
          $ref: "#/components/schemas/CallTotals"

    CallRecord:
      type: object
      required: [id, lead, to, started_at, seconds, cost_microdollars, outcome, note]
      properties:
        id:
          type: string
          format: uuid
        lead:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LeadRef"
        to:
          type: string
        started_at:
          type: string
          format: date-time
        seconds:
          type: integer
        cost_microdollars:
          type: integer
          format: int64
        outcome:
          type: string
          nullable: true
        note:
          type: string

    Recording:
      type: object
      properties:
        call_id:
          type: string
          format: uuid
        file_url:
          type: string
        seconds:
          type: integer
        transcript:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        suggested_followup_at:
          type: string
          format: date
          nullable: true

    Pairing:
      type: object
      required: [id, status, phone_name, muted, expires_at, phone_seen_at, call, phone]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [none, waiting, linked, lost]
        phone_name:
          type: string
        muted:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: While waiting, when the code stops working
        phone_seen_at:
          type: string
          format: date-time
          nullable: true
          description: The phone's last check-in; a call on it is ended 15 seconds after
        phone:
          type: string
          enum: [telnyx, fake]
          description: Which browser phone the linked phone uses
        code:
          type: string
          description: Only in the reply that made it
        token:
          type: string
          description: Only in the join reply
        call:
          type: object
          nullable: true
          required: [id, status, lead_name, from, to, client_state, answered_at, price_per_minute_microdollars, needs_dial]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [dialing, ringing, answered]
            lead_name:
              type: string
            from:
              type: string
            to:
              type: string
            client_state:
              type: string
              description: Empty except for the phone
            answered_at:
              type: string
              format: date-time
              nullable: true
            price_per_minute_microdollars:
              type: integer
              format: int64
            needs_dial:
              type: boolean
              description: The laptop started it and the phone hasn't dialled yet

    Verification:
      type: object
      required: [status, id_type, country, reason, submitted_at, decided_at]
      properties:
        status:
          type: string
          enum: [none, pending, review, approved, rejected]
          description: review means the provider approved it but the name doesn't match, so a person checks it
        id_type:
          type: string
        country:
          type: string
        reason:
          type: string
          description: The provider's words for a rejection
        submitted_at:
          type: string
          format: date-time
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true

    VerificationRequest:
      type: object
      required: [id_type, country, id_image, selfie]
      properties:
        id_type:
          type: string
          enum: [national_id, passport, drivers_licence, ghana_card, kenya_id]
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        id_image:
          type: string
          description: Front of the ID, JPEG or PNG, base64 or a data URL
        selfie:
          type: string
        liveness:
          type: array
          maxItems: 8
          items:
            type: string

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Plan limit or rule violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    PaymentRequired:
      description: Insufficient balance
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TooManyRequests:
      description: Too many tries or sends; see the Retry-After header when present
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ValidationError:
      description: Request body validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
