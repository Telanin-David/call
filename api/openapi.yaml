openapi: "3.1.0"
info:
  title: Dialer API
  version: "0.1.0"
  description: |
    Single API contract for the Dialer sales dialer.
    All routes require a session cookie except /auth/signup, /auth/signin, /auth/confirm/email,
    /auth/forgot and /auth/reset. Writes must be sent as application/json.
    Money is always an integer in micro-dollars (1 USD = 1,000,000).
servers:
  - url: http://localhost:8080
    description: Local dev
  - url: https://api.dialer.app
    description: Production

tags:
  - name: auth
    description: Sign up, confirm, sign in, sign out, reset password
  - name: me
    description: Profile, settings, today's limits
  - name: plans
    description: Compare, upgrade, move to Free
  - name: wallet
    description: Balance, activity, statement, top-ups
  - name: numbers
    description: Search, rent, cancel, set default
  - name: lists
    description: Lead lists
  - name: leads
    description: Leads within a list
  - name: imports
    description: CSV upload, column matching, check, add
  - name: scripts
    description: Rep scripts
  - name: calls
    description: Call lifecycle
  - name: dialer
    description: Auto-dial engine
  - name: followups
    description: Follow-up tasks
  - name: history
    description: Call log
  - name: recordings
    description: Call recordings (Pro)
  - name: kyc
    description: ID and face check
  - name: pairing
    description: Phone–laptop pairing via QR code
  - name: admin
    description: Admin console endpoints
  - name: webhooks
    description: Inbound webhooks from providers

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string

  /auth/signup:
    post:
      tags: [auth]
      summary: Create an account and sign in
      description: |
        Sends a confirmation link by email and a 6-digit code by SMS, and sets
        the session cookie. The account can be used once both are confirmed.
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/confirm/email:
    post:
      tags: [auth]
      summary: Confirm the email with the token from the emailed link
      description: Needs no session; the link may be opened on another device. Opening it twice is fine.
      operationId: authConfirmEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Email confirmed
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/confirm/phone:
    post:
      tags: [auth]
      summary: Confirm the phone with the 6-digit code
      description: Five wrong tries end the code; ask for a new one with /auth/resend.
      operationId: authConfirmPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "307142"
      responses:
        "200":
          description: Phone confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/resend:
    post:
      tags: [auth]
      summary: Send a new email link or phone code
      description: At most one a minute and five an hour. A new code replaces the old one.
      operationId: authResend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [email, sms, whatsapp]
      responses:
        "204":
          description: Sent (or nothing to send because it is already confirmed)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/signin:
    post:
      tags: [auth]
      summary: Sign in with email or phone and password
      operationId: authSignin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          description: Signed in; session cookie set. If `confirmed` is false, show the confirm screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/signout:
    post:
      tags: [auth]
      summary: Sign out; clears session cookie
      operationId: authSignout
      responses:
        "204":
          description: Signed out

  /auth/forgot:
    post:
      tags: [auth]
      summary: Send a password reset code to the account's phone
      description: Answers 204 whether or not the account exists.
      operationId: authForgot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login:
                  type: string
                  description: Email or phone number
      responses:
        "204":
          description: Code sent if the account exists
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset:
    post:
      tags: [auth]
      summary: Set a new password using the reset code
      description: Signs the account out on every device.
      operationId: authReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, code, password]
              properties:
                login:
                  type: string
                  description: Email or phone number
                code:
                  type: string
                password:
                  type: string
                  minLength: 10
      responses:
        "204":
          description: Password updated
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      tags: [me]
      summary: Get own profile and today's limits
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/settings:
    patch:
      tags: [me]
      summary: Update settings (timezone, country, etc.)
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /plans:
    get:
      tags: [plans]
      summary: Free, Starter and Pro with their prices
      description: Signed-in reps also get intro_eligible (the intro price is for a first paid plan only).
      operationId: listPlans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                  intro_eligible:
                    type: boolean

  /subscription:
    get:
      tags: [plans]
      summary: The rep's plan, next renewal and any booked change
      operationId: getSubscription
      responses:
        "200":
          description: OK. Only `plan` is set on Free.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [plans]
      summary: Change plan
      description: |
        Moving up starts now and is paid from the balance today: the first
        month from Free, or the difference for the rest of the month between
        paid plans. Moving down (including to Free) is booked for the next
        renewal; the rep keeps what they paid for until then. Choosing the
        current plan cancels a booked move.
      operationId: changeSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeRequest"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanQuote"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /subscription/quote:
    post:
      tags: [plans]
      summary: What a change of plan would cost, without making it
      operationId: quoteSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanQuote"

  /wallet:
    get:
      tags: [wallet]
      summary: Balance, money held for calls, this month's spending, and the first page of activity
      operationId: getWallet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallet/activity:
    get:
      tags: [wallet]
      summary: More activity, newest first (holds are not listed)
      operationId: getWalletActivity
      parameters:
        - name: cursor
          in: query
          description: next_cursor from the previous page
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerEntry"
                  next_cursor:
                    type: string
                    description: Empty when there are no more entries

  /wallet/statement:
    get:
      tags: [wallet]
      summary: One month's statement as CSV, in the rep's time zone, with exact amounts
      operationId: getWalletStatement
      parameters:
        - name: month
          in: query
          description: YYYY-MM; defaults to the current month
          schema:
            type: string
            example: "2026-10"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /wallet/topups:
    post:
      tags: [wallet]
      summary: Start a card top-up
      description: |
        Opens a checkout with Paystack (cards from Nigeria, Ghana, Kenya) or
        Stripe (everyone else); the server picks by the rep's country. Nothing
        reaches the balance until the provider's signed webhook confirms the
        payment. Needs confirmed email and phone.
      operationId: startTopup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
      responses:
        "201":
          description: Send the rep to payment_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /wallet/topups/{reference}:
    get:
      tags: [wallet]
      summary: Where a top-up is, for the page the rep returns to
      operationId: getTopup
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                  status:
                    type: string
                    enum: [pending, succeeded, failed]
                  amount_microdollars:
                    type: integer
                    format: int64
                  created_at:
                    type: string
                    format: date-time
        "404":
          description: Not this rep's top-up

  /numbers:
    get:
      tags: [numbers]
      summary: Search available numbers by area code
      operationId: searchNumbers
      parameters:
        - name: area_code
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
            default: US
      responses:
        "200":
          description: Available numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailableNumber"

  /numbers/mine:
    get:
      tags: [numbers]
      summary: List rented numbers
      operationId: listMyNumbers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/RentedNumber"

  /numbers/{numberId}:
    delete:
      tags: [numbers]
      summary: Cancel a rented number
      operationId: cancelNumber
      parameters:
        - name: numberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cancelled

  /numbers/{numberId}/default:
    put:
      tags: [numbers]
      summary: Set as default outbound number
      operationId: setDefaultNumber
      parameters:
        - name: numberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Default set

  /lists:
    get:
      tags: [lists]
      summary: List all lead lists
      operationId: listLeadLists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadList"
    post:
      tags: [lists]
      summary: Create a lead list
      operationId: createLeadList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"

  /lists/{listId}/imports:
    post:
      tags: [imports]
      summary: Upload a CSV and get column mapping suggestions
      operationId: uploadCSV
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import preview with column mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"

  /lists/{listId}/imports/{importId}/confirm:
    post:
      tags: [imports]
      summary: Confirm column mapping and import leads
      operationId: confirmImport
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: importId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnMapping"
      responses:
        "202":
          description: Import started

  /scripts:
    get:
      tags: [scripts]
      summary: List scripts
      operationId: listScripts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Script"
    post:
      tags: [scripts]
      summary: Create a script
      operationId: createScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"

  /calls:
    post:
      tags: [calls]
      summary: Start a call
      operationId: startCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCallRequest"
      responses:
        "200":
          description: Call started; includes short-lived Telnyx token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartCallResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /calls/{callId}/outcome:
    post:
      tags: [calls]
      summary: Save call outcome
      operationId: saveOutcome
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutcomeRequest"
      responses:
        "204":
          description: Saved

  /calls/{callId}/end:
    post:
      tags: [calls]
      summary: End a call early
      operationId: endCall
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Ended

  /dialer/start:
    post:
      tags: [dialer]
      summary: Start auto-dial session (Starter/Pro)
      operationId: startDialer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_id]
              properties:
                list_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Session started

  /dialer/pause:
    post:
      tags: [dialer]
      summary: Pause auto-dial
      operationId: pauseDialer
      responses:
        "204":
          description: Paused

  /dialer/skip:
    post:
      tags: [dialer]
      summary: Skip current lead
      operationId: skipDialer
      responses:
        "204":
          description: Skipped

  /dialer/stop:
    post:
      tags: [dialer]
      summary: Stop auto-dial session
      operationId: stopDialer
      responses:
        "204":
          description: Stopped

  /followups:
    get:
      tags: [followups]
      summary: List follow-ups (today, tomorrow, later)
      operationId: listFollowups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  followups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Followup"

  /history:
    get:
      tags: [history]
      summary: Full call log
      operationId: listHistory
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"

  /recordings/{callId}:
    get:
      tags: [recordings]
      summary: Get recording metadata (Pro)
      operationId: getRecording
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"

  /kyc:
    post:
      tags: [kyc]
      summary: Start ID and face check
      operationId: startKyc
      responses:
        "200":
          description: Smile ID session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string

    get:
      tags: [kyc]
      summary: Get KYC status
      operationId: getKycStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"

  /pairing:
    post:
      tags: [pairing]
      summary: Create a QR pairing code (laptop side)
      operationId: createPairing
      responses:
        "200":
          description: One-time code (5 min TTL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  qr_url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /pairing/join:
    post:
      tags: [pairing]
      summary: Join as phone audio leg using pairing code
      operationId: joinPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Joined; Telnyx WebRTC token for phone leg
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /webhooks/telnyx:
    post:
      tags: [webhooks]
      summary: Telnyx call events webhook
      operationId: telnyxWebhook
      responses:
        "200":
          description: Acknowledged

  /webhooks/paystack:
    post:
      tags: [webhooks]
      summary: Paystack payment webhook
      description: Checked with x-paystack-signature (HMAC-SHA512 of the body) before anything is read. A repeated webhook never credits twice.
      operationId: paystackWebhook
      responses:
        "200":
          description: Acknowledged
        "401":
          description: Signature missing or wrong

  /webhooks/stripe:
    post:
      tags: [webhooks]
      summary: Stripe payment webhook
      description: Checked with Stripe-Signature (HMAC-SHA256, 5-minute window) before anything is read. A repeated webhook never credits twice.
      operationId: stripeWebhook
      responses:
        "200":
          description: Acknowledged
        "401":
          description: Signature missing or wrong

  /webhooks/smileid:
    post:
      tags: [webhooks]
      summary: Smile ID result webhook
      operationId: smileidWebhook
      responses:
        "200":
          description: Acknowledged

  /admin/users:
    get:
      tags: [admin]
      summary: List users
      operationId: adminListUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: OK

  /admin/kyc:
    get:
      tags: [admin]
      summary: List pending KYC checks
      operationId: adminListKyc
      responses:
        "200":
          description: OK

components:
  schemas:
    ErrorBody:
      type: object
      required: [error, code]
      description: Every error has this shape. `error` is shown to the rep as is.
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable reason, e.g. "code_wrong"
        fields:
          type: object
          additionalProperties:
            type: string

    SignupRequest:
      type: object
      required: [name, email, phone, password, country, accept_rules]
      properties:
        name:
          type: string
          description: Full name as on the rep's ID; the card name must match it
        email:
          type: string
          format: email
        phone:
          type: string
          description: With country code, e.g. "+234 803 123 4567"; stored as E.164
        password:
          type: string
          minLength: 10
        country:
          type: string
          description: ISO 3166-1 alpha-2
        timezone:
          type: string
          description: IANA zone, e.g. "Africa/Lagos". Defaults to UTC.
        accept_rules:
          type: boolean
          description: Must be true

    SigninRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Email or phone number
        password:
          type: string

    User:
      type: object
      required: [user_id, name, email, phone, country, timezone, email_confirmed, phone_confirmed, confirmed, rules_accepted_at, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        country:
          type: string
        timezone:
          type: string
        email_confirmed:
          type: boolean
        phone_confirmed:
          type: boolean
        confirmed:
          type: boolean
          description: Both email and phone confirmed
        rules_accepted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    MeResponse:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [plan, balance_microdollars, held_microdollars]
          properties:
            plan:
              type: string
              enum: [free, starter, pro]
            balance_microdollars:
              type: integer
              format: int64
              description: What the rep can spend now. 1 USD = 1,000,000.
            held_microdollars:
              type: integer
              format: int64
              description: Set aside for calls in progress; already taken off the balance

    SettingsRequest:
      type: object
      properties:
        timezone:
          type: string
        country:
          type: string

    Plan:
      type: object
      required: [id, monthly_fee_microdollars, intro_fee_microdollars, intro_months, rate_multiplier_pct, us_price_per_minute_microdollars, dials_per_day, features]
      properties:
        id:
          type: string
          enum: [free, starter, pro]
        monthly_fee_microdollars:
          type: integer
          format: int64
        intro_fee_microdollars:
          type: integer
          format: int64
        intro_months:
          type: integer
        rate_multiplier_pct:
          type: integer
          description: Call price = provider cost × this ÷ 100
        us_price_per_minute_microdollars:
          type: integer
          format: int64
        dials_per_day:
          type: integer
          nullable: true
        features:
          type: array
          items:
            type: string

    Subscription:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, starter, pro]
        started_at:
          type: string
          format: date-time
        intro_ends_on:
          type: string
          format: date
          nullable: true
        next_renewal:
          type: string
          format: date
        pending_change:
          type: string
          nullable: true
          description: Plan the rep moves to at next_renewal
        next_charge_microdollars:
          type: integer
          format: int64
        renewal_failed_at:
          type: string
          format: date-time
          nullable: true
        grace_ends_at:
          type: string
          format: date-time
          nullable: true
          description: Top up before this or move to Free

    PlanChangeRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id:
          type: string
          enum: [free, starter, pro]

    PlanQuote:
      type: object
      required: [from, to, kind, due_today_microdollars, intro_price, starts_on, next_renewal, next_charge_microdollars, balance_microdollars, balance_after_microdollars]
      properties:
        from:
          type: string
        to:
          type: string
        kind:
          type: string
          enum: [upgrade, downgrade, stay]
        due_today_microdollars:
          type: integer
          format: int64
        intro_price:
          type: boolean
        starts_on:
          type: string
          format: date
        next_renewal:
          type: string
          format: date
          nullable: true
        next_charge_microdollars:
          type: integer
          format: int64
        balance_microdollars:
          type: integer
          format: int64
        balance_after_microdollars:
          type: integer
          format: int64

    WalletResponse:
      type: object
      required: [balance_microdollars, held_microdollars, spent_this_month, activity, next_cursor, min_topup_microdollars, max_topup_microdollars, topup_provider]
      properties:
        balance_microdollars:
          type: integer
          format: int64
          description: What the rep can spend now. 1 USD = 1,000,000.
        held_microdollars:
          type: integer
          format: int64
        spent_this_month:
          type: object
          required: [calls, plan, numbers, total]
          properties:
            calls:
              type: integer
              format: int64
            plan:
              type: integer
              format: int64
            numbers:
              type: integer
              format: int64
            total:
              type: integer
              format: int64
        activity:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        next_cursor:
          type: string
        min_topup_microdollars:
          type: integer
          format: int64
        max_topup_microdollars:
          type: integer
          format: int64
        topup_provider:
          type: string
          enum: [paystack, stripe]

    LedgerEntry:
      type: object
      required: [id, type, amount_microdollars, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [topup, call, number, plan, refund]
        amount_microdollars:
          type: integer
          format: int64
          description: Positive in, negative out
        description:
          type: string
        created_at:
          type: string
          format: date-time

    TopupRequest:
      type: object
      required: [amount_microdollars]
      properties:
        amount_microdollars:
          type: integer
          format: int64
          minimum: 5000000
          maximum: 500000000
          description: Whole cents ($5 to $500)

    TopupResponse:
      type: object
      required: [reference, payment_url, provider, amount_microdollars]
      properties:
        reference:
          type: string
        payment_url:
          type: string
        provider:
          type: string
          enum: [paystack, stripe]
        amount_microdollars:
          type: integer
          format: int64

    AvailableNumber:
      type: object
      properties:
        number:
          type: string
        area_code:
          type: string
        city:
          type: string
        monthly_price_usd:
          type: number

    RentedNumber:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        city:
          type: string
        is_default:
          type: boolean
        monthly_price_usd:
          type: number
        renews_at:
          type: string
          format: date

    LeadList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lead_count:
          type: integer
        called_count:
          type: integer
        created_at:
          type: string
          format: date-time

    ImportPreview:
      type: object
      properties:
        import_id:
          type: string
          format: uuid
        row_count:
          type: integer
        columns:
          type: array
          items:
            type: string
        suggestions:
          type: object
          description: Suggested column→field mapping
        duplicates:
          type: integer
        dnc_hits:
          type: integer

    ColumnMapping:
      type: object
      properties:
        phone:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        company:
          type: string
        city:
          type: string
        timezone:
          type: string

    Script:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parts:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              body:
                type: string

    ScriptRequest:
      type: object
      required: [name, parts]
      properties:
        name:
          type: string
        parts:
          type: array
          items:
            type: object

    StartCallRequest:
      type: object
      required: [lead_id, from_number_id]
      properties:
        lead_id:
          type: string
          format: uuid
        from_number_id:
          type: string
          format: uuid
        device:
          type: string
          enum: [laptop, phone, linked]
          default: laptop

    StartCallResponse:
      type: object
      properties:
        call_id:
          type: string
          format: uuid
        telnyx_token:
          type: string
        telnyx_call_id:
          type: string

    OutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: ["1", "2", "3", "4", "5", "6"]
          description: "1=interested, 2=callback, 3=not interested, 4=voicemail, 5=no answer, 6=wrong number"
        note:
          type: string
        followup_at:
          type: string
          format: date-time
          nullable: true

    Followup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        lead_name:
          type: string
        lead_phone:
          type: string
        due_at:
          type: string
          format: date-time
        reason:
          type: string

    HistoryResponse:
      type: object
      properties:
        calls:
          type: array
          items:
            $ref: "#/components/schemas/CallRecord"
        total:
          type: integer
        page:
          type: integer

    CallRecord:
      type: object
      properties:
        call_id:
          type: string
          format: uuid
        lead_name:
          type: string
        lead_phone:
          type: string
        from_number:
          type: string
        started_at:
          type: string
          format: date-time
        seconds:
          type: integer
        cost_microdollars:
          type: integer
          format: int64
        outcome:
          type: string
        note:
          type: string

    Recording:
      type: object
      properties:
        call_id:
          type: string
          format: uuid
        file_url:
          type: string
        seconds:
          type: integer
        transcript:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        suggested_followup_at:
          type: string
          format: date
          nullable: true

    KycStatus:
      type: object
      properties:
        status:
          type: string
          enum: [none, pending, approved, rejected]
        submitted_at:
          type: string
          format: date-time
          nullable: true
        result_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Plan limit or rule violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    PaymentRequired:
      description: Insufficient balance
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TooManyRequests:
      description: Too many tries or sends; see the Retry-After header when present
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ValidationError:
      description: Request body validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
